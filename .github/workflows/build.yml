name: "Godot 4 Build Pipeline"

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  export:
    name: Build & Export Executables
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source
        uses: actions/checkout@v4

      - name: Export Godot 4 App
        uses: firebelley/godot-export@v6.0.0
        with:
          # Remove broken hardcoded URLs and let the action handle downloads automatically, 
          # or use the latest stable action defaults.
          relative_project_path: ./
          archive_output: true
